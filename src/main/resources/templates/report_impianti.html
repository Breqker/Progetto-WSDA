<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Segnalazioni e statistiche</title>
    <link rel="stylesheet" type="text/css" href="/Report_Impianti/report_impianti.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="/Report_Impianti/report_impianti.js"></script>
</head>
<body>
<h1>Segnalazioni e statistiche</h1>

<form action="/dbaccess/segnalazioni" method="post" onsubmit="return validateForm(event)">
    <label for="idImpianto">Seleziona impianto:</label>
    <select id="idImpianto" name="idImpianto">
        <option th:each="impianto : ${impianti}" th:value="${impianto.idImpianto}" th:text="${impianto.idImpianto}"></option>
    </select>
    <br>
    <label for="startDateTime">Data inizio:</label>
    <input type="datetime-local" id="startDateTime" name="startDateTime">
    <br>
    <label for="endDateTime">Data fine:</label>
    <input type="datetime-local" id="endDateTime" name="endDateTime">
    <br>
    <button type="submit">Cerca</button>
</form>

<div id="resultsSection" th:if="${not #lists.isEmpty(segnalazioni)}">
    <h2>Segnalazioni trovate</h2>
    <table id="segnalazioniTable">
        <thead>
        <tr>
            <th>ID Segnalazione</th>
            <th>ID Cartellone</th>
            <th>Durata Visualizzazione</th>
            <th>Data Inserimento</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="segnalazione : ${segnalazioni}">
            <td th:text="${segnalazione.idSegnalazione}"></td>
            <td th:text="${segnalazione.codCartellone}"></td>
            <td th:text="${segnalazione.durataVisual}"></td>
            <td th:text="${#temporals.format(segnalazione.dataInserimento, 'dd-MM-yyyy HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <h2>Statistiche</h2>
    <p>Somma delle durate di visualizzazione: <span th:text="${sommaDurate}"></span></p>
    <p>Numero totale di segnalazioni: <span th:text="${numeroSegnalazioni}"></span></p>

    <h2>Grafici</h2>
    <div class="chart-container">
        <div class="chart-item">
            <div id="barChart"></div>
        </div>
        <div class="chart-item">
            <div id="pieChart"></div>
        </div>
        <div class="chart-item">
            <div id="lineChart"></div>
        </div>
        <div class="chart-item">
            <div id="radarChart"></div>
        </div>
    </div>
</div>

</body>
</html>
