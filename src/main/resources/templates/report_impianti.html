<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Impianti</title>
</head>
<body>
<h1>Report Impianti</h1>

<!-- Form per filtro per codice cartellone -->
<form action="#" th:action="@{/dbaccess/reportByCartellone}" method="get">
    <label for="codCartellone">Seleziona Codice Cartellone:</label>
    <select name="codCartellone" id="codCartellone">
        <option th:each="codCartellone : ${codCartelloneList}"
                th:value="${codCartellone}"
                th:text="${codCartellone}">Cartellone</option>
    </select>
    <button type="submit">Filtra per Codice Cartellone</button>
</form>

<hr/>

<!-- Form per filtro per intervallo di date -->
<form action="#" th:action="@{/dbaccess/reportByDateRange}" method="get">
    <label for="startDate">Data Inizio:</label>
    <input type="date" id="startDate" name="startDate" required>

    <label for="endDate">Data Fine:</label>
    <input type="date" id="endDate" name="endDate" required>

    <button type="submit">Filtra per Intervallo di Date</button>
</form>

<hr/>

<!-- Form per filtro combinato -->
<form action="#" th:action="@{/dbaccess/reportByCartelloneAndDateRange}" method="get">
    <label for="codCartelloneCombo">Seleziona Codice Cartellone:</label>
    <select name="codCartellone" id="codCartelloneCombo">
        <option th:each="codCartellone : ${codCartelloneList}"
                th:value="${codCartellone}"
                th:text="${codCartellone}">Cartellone</option>
    </select>

    <label for="startDateCombo">Data Inizio:</label>
    <input type="date" id="startDateCombo" name="startDate" required>

    <label for="endDateCombo">Data Fine:</label>
    <input type="date" id="endDateCombo" name="endDate" required>

    <button type="submit">Filtra per Codice Cartellone e Intervallo di Date</button>
</form>

<hr/>

<!-- Form per somma della durata di visualizzazione per codice cartellone e intervallo di date -->

<form action="#" th:action="@{/dbaccess/sumDurataVisualizzazione}" method="get">
    <label for="codCartelloneSum">Seleziona Codice Cartellone:</label>
    <select name="codCartellone" id="codCartelloneSum" th:value="${codCartellone}">
        <option th:each="codCartellone : ${codCartelloneList}"
                th:value="${codCartellone}"
                th:text="${codCartellone}">Cartellone</option>
    </select>

    <label for="startDateSum">Data Inizio:</label>
    <input type="date" id="startDateSum" name="startDate" th:value="${startDate}" required>

    <label for="endDateSum">Data Fine:</label>
    <input type="date" id="endDateSum" name="endDate" th:value="${endDate}" required>

    <button type="submit">Calcola Somma Durata Visualizzazione</button>
</form>


<!-- Aggiunta sezione per visualizzare la somma della durata di visualizzazione -->
<div th:if="${durataVisualizzazione != null}">
    <p th:text="'Somma Durata Visualizzazione: ' + ${durataVisualizzazione}"></p>
</div>

<hr/>

<table>
    <thead>
    <tr>
        <th>Codice Impianto</th>
        <th>Codice Palinsesto</th>
        <th>Data Inserimento</th>
        <th>Durata Visualizzazione</th>
        <th>Codice Cartellone</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="segnalazione : ${segnalazioni}">
        <td th:text="${segnalazione.impianto.idImpianto}">Impianto</td>
        <td th:text="${segnalazione.palinsesto.idPalinsesto}">Palinsesto</td>
        <td th:text="${segnalazione.dataInserimento}">Data Inserimento</td>
        <td th:text="${segnalazione.durataVisual}">Durata Visualizzazione</td>
        <td th:text="${segnalazione.codCartellone}">Cartellone</td>
    </tr>
    </tbody>
</table>
</body>
</html>
