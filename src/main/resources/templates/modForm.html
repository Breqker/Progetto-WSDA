<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifica Impianto</title>
</head>
<body>
<h2>Modifica Impianto</h2>
<form th:action="@{/dbaccess/mod/{idImpianto}(idImpianto=${impianto.idImpianto})}" th:object="${impianto}" method="post">
    <input type="hidden" th:field="*{idImpianto}">

    <label>ID Palinsesto:</label>
    <select th:field="*{palinsesto.idPalinsesto}" required>
        <option th:each="p : ${palinsesti}"
                th:value="${p.idPalinsesto}"
                th:text="${p.idPalinsesto}"
                th:selected="${impianto.palinsesto.idPalinsesto == p.idPalinsesto}"></option>
    </select><br>

    <label>Stato:</label>
    <input type="checkbox" th:field="*{stato}" /><br>

    <label>Latitudine:</label>
    <input type="text" th:field="*{latitudine}" required><br>

    <label>Longitudine:</label>
    <input type="text" th:field="*{longitudine}" required><br>

    <button type="submit">Modifica Impianto</button>
</form>

</body>
</html>
