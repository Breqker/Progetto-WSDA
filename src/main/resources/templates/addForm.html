<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Impianto</title>
</head>
<body>
<h2>Add New Impianto</h2>
<form th:action="@{/dbaccess/add}" th:object="${impianto}" method="post">
    <label>ID Impianto:</label>
    <input type="text" th:field="*{idImpianto}" required><br>

    <label>ID Palinsesto:</label>
    <select th:field="*{palinsesto.idPalinsesto}" required>
        <option th:each="palinsesto : ${palinsesti}"
                th:value="${palinsesto.idPalinsesto}"
                th:text="${palinsesto.idPalinsesto}"></option>
    </select><br>

    <label>Latitudine:</label>
    <input type="text" th:field="*{latitudine}" required><br>

    <label>Longitudine:</label>
    <input type="text" th:field="*{longitudine}" required><br>

    <button type="submit">Add Impianto</button>
</form>
</body>
</html>
