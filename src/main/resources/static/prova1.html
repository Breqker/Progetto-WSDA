<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invia Segnalazione</title>
</head>
<body>
<h1>Invia Segnalazione</h1>
<form id="segnalazioneForm">
    <label for="idSegnalazione">ID Segnalazione:</label>
    <input type="text" id="idSegnalazione" name="idSegnalazione" required><br><br>

    <label for="codImpianto">Cod Impianto:</label>
    <input type="text" id="codImpianto" name="codImpianto" required><br><br>

    <label for="codPalinsesto">Cod Palinsesto:</label>
    <input type="text" id="codPalinsesto" name="codPalinsesto" required><br><br>

    <label for="codCartellone">Cod Cartellone:</label>
    <input type="text" id="codCartellone" name="codCartellone" required><br><br>

    <label for="durataVisual">Durata Visual (in minuti):</label>
    <input type="number" id="durataVisual" name="durataVisual" required><br><br>

    <button type="submit">Invia Segnalazione</button>
</form>

<div id="rispostaServer"></div>

<script>
    document.getElementById("segnalazioneForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Evita il comportamento di default del modulo di invio del modulo

        // Recupera i dati dal modulo
        const idSegnalazione = document.getElementById("idSegnalazione").value;
        const codImpianto = document.getElementById("codImpianto").value;
        const codPalinsesto = document.getElementById("codPalinsesto").value;
        const codCartellone = document.getElementById("codCartellone").value;
        const durataVisual = parseInt(document.getElementById("durataVisual").value);

        // Crea l'oggetto segnalazione
        const segnalazione = {
            idSegnalazione: idSegnalazione,
            codImpianto: codImpianto,
            codPalinsesto: codPalinsesto,
            codCartellone: codCartellone,
            durataVisual: durataVisual
        };

        // Effettua la richiesta fetch alla servlet
        fetch('http://localhost:8000/Progetto_WSDA_EE_war_exploded/monitoraggio_servlet', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(segnalazione)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Errore durante l\'invio della segnalazione');
                }
                console.log('Segnalazione inviata con successo');
                return response.text(); // Ritorna il testo della risposta
            })
            .then(data => {
                document.getElementById("rispostaServer").innerText = data;
            })
            .catch(error => {
                document.getElementById("rispostaServer").innerText = 'Errore: ' + error.message;
                console.error('Errore durante l\'invio della segnalazione:', error);
            });
    });
</script>
</body>
</html>
