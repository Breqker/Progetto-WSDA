<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Impianti</title>
    <link rel="stylesheet" href="gestione_impianti.css">
</head>
<body>
<div class="container">
    <h1>Gestione Impianti</h1>
    <table id="impiantiTable">
        <thead>
        <tr>
            <th>Nome Impianto</th>
            <th>Palinsesto</th>
            <th>Stato</th>
            <th>Latitudine</th>
            <th>Longitudine</th>
            <th>Azioni</th>
        </tr>
        </thead>
        <tbody>
        <!-- Initial rows -->
        </tbody>
    </table>
    <button id="addImpiantoBtn">Aggiungi Impianto</button>

    <!-- Modal for adding/editing impianto -->
    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
            <button class="close-btn" aria-label="Close">&times;</button>
            <h2 id="modalTitle">Aggiungi Nuovo Impianto</h2>
            <form id="impiantoForm">
                <label for="nome">Nome Impianto:</label>
                <input type="text" id="nome" name="nome" required>
                <label for="palinsesto">Palinsesto:</label>
                <select id="palinsesto" name="palinsesto" required>
                    <option value="Palinsesto 1">Palinsesto 1</option>
                    <option value="Palinsesto 2">Palinsesto 2</option>
                    <option value="Palinsesto 3">Palinsesto 3</option>
                    <option value="Palinsesto 4">Palinsesto 4</option>
                    <option value="Palinsesto 5">Palinsesto 5</option>
                </select>
                <label for="latitudine">Latitudine:</label>
                <input type="text" id="latitudine" name="latitudine" required>
                <label for="longitudine">Longitudine:</label>
                <input type="text" id="longitudine" name="longitudine" required>
                <button type="submit" id="submitBtn">Aggiungi</button>
                <button type="button" id="cancelBtn">Annulla</button>
            </form>
        </div>
    </div>

    <!-- Modal for confirming deletion -->
    <div id="confirmModal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Conferma Eliminazione</h2>
            <p>Sei sicuro di voler eliminare questo impianto?</p>
            <button id="confirmDeleteBtn">Elimina</button>
            <button id="cancelDeleteBtn">Annulla</button>
        </div>
    </div>
</div>
<script src="gestione_impianti.js"></script>
</body>
</html>
